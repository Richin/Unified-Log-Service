services:
  app:
    build: .
    image: elastic-email-logger:latest
    environment:
      PORT: 3000
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      ELASTICSEARCH_EMAIL_LOG_INDEX: ${ELASTICSEARCH_EMAIL_LOG_INDEX}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-e}
      ELASTICSEARCH_TLS_REJECT_UNAUTHORIZED: ${ELASTICSEARCH_TLS_REJECT_UNAUTHORIZED}
    depends_on:
      - elasticsearch
    ports:
      - "3001:3000"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - xpack.security.enabled=true
    ports:
      - "9201:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
    depends_on:
      - elasticsearch
